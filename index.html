<style>
:root{--navy:#0b2a5b;--navy-dk:#001a3d;--navy-lt:#123f7d;--gold:#c8a04a;--gold-lt:#e2c47f;--ink:#1a1d21;--muted:#55606e;--line:#d8dde5;--bg-alt:#f4f5f7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif}
a{color:var(--navy);text-decoration:none}
img,svg{display:block;max-width:100%}
.skip{position:absolute;left:-9999px}

.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem}
.gov-bar{background:var(--navy-dk);color:#c7d2e0;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

.masthead{border-bottom:3px solid var(--gold);padding:1rem 0}

.div{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}

.search{display:flex;border:1px solid var(--line);flex:1}
.search input{border:0;padding:.5rem .6rem;font-size:13px;width:100%;outline:0}
.search button{border:0;background:var(--navy);color:#fff;padding:0 .7rem;cursor:pointer}
.btn{display:inline-block;padding:.7rem 1.2rem;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:2px solid transparent;cursor:pointer;transition:.18s;text-align:center;font-family:inherit}
.btn-gold{background:var(--gold);color:#111}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{border-color:rgba(255,255,255,.5);color:#fff}
.main-nav{background:var(--navy);position:sticky;top:0;z-index:90}
.main-nav .wrap{display:flex;flex-wrap:wrap;position:relative}
.main-nav a{color:#e8eef7;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.9rem .7rem;border-bottom:3px solid transparent}

.nav-toggle{display:none;background:0;border:0;color:#fff;font-size:20px;padding:.8rem;cursor:pointer;margin-left:auto}
.alert-bar{background:#fdf3dc;border-bottom:1px solid #e6d3a0;font-size:13px}
.alert-bar .wrap{display:flex;gap:.6rem;padding:.7rem 1.25rem}
.alert-bar strong{color:#7a4f00;text-transform:uppercase;font-size:10.5px;letter-spacing:.12em;flex-shrink:0;padding-top:.2rem}
.hero{background:linear-gradient(135deg,var(--navy-dk),var(--navy) 60%,#16427e);color:#fff;overflow:hidden}
.hero .wrap{padding-top:2.8rem;padding-bottom:2.8rem}
.hero h1{font-size:clamp(1.8rem,7vw,2.9rem);line-height:1.12;margin-bottom:.9rem}

.kicker{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:.8rem;font-weight:700}

.hero-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9db4cf}

.section{padding:2.8rem 0}
.section.alt{background:var(--bg-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.rule{height:3px;width:52px;background:var(--gold);margin-bottom:1rem}
.stat-band{background:var(--navy-dk);color:#fff;padding:2.2rem 0}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.3rem;text-align:center}

.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);padding:1.3rem}

.more{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:.8rem;display:inline-block}
.steps{counter-reset:s;display:grid;gap:.9rem}
.step{display:flex;gap:1rem;background:#fff;border:1px solid var(--line);padding:1.1rem}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:Georgia,serif;font-size:1.3rem;font-weight:700;color:var(--gold);flex-shrink:0}
.step h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem;color:var(--navy-dk)}
.step p{font-size:13px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{background:var(--navy);color:#fff;text-align:left;padding:.65rem .7rem;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
td{padding:.6rem .7rem;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:var(--bg-alt)}
.form-shell{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);padding:1.4rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-dk);margin-bottom:.3rem}
.hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px}

.page-head{background:var(--bg-alt);border-bottom:1px solid var(--line);padding:1.8rem 0 2rem}

.notice.blue{border-color:var(--navy);background:#eef2f8;color:#2b3644}

.footer{background:var(--navy-dk);color:#b9c8da;padding:2.2rem 0 1.4rem;font-size:13px;border-top:4px solid var(--gold);margin-top:2rem}

.hp{position:absolute!important;left:-9999px!important;opacity:0!important;height:0;width:0}
@media(min-width:700px){
  .mast-right{width:auto}
  .search{flex:none}
  .search input{width:170px}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:repeat(2,1fr)}

  .main-nav.open a{display:block}
}
</style>

const seal = `<svg class="seal" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#0b2a5b"/><circle cx="100" cy="100" r="88" fill="none" stroke="#c8a04a" stroke-width="2"/><circle cx="100" cy="100" r="60" fill="#0b2a5b" stroke="#c8a04a" stroke-width="1.5"/><defs><path id="aT" d="M100,100 m-78,0 a78,78 0 1,1 156,0"/><path id="aB" d="M100,100 m-78,0 a78,78 0 1,0 156,0"/></defs><text fill="#c8a04a" font-size="10.5" font-weight="700" letter-spacing="2.1" font-family="Georgia,serif"><textPath href="#aT" startOffset="50%" text-anchor="middle">INDEPENDENT INTAKE</textPath></text><text fill="#c8a04a" font-size="8.5" font-weight="700" letter-spacing="1.8" font-family="Georgia,serif"><textPath href="#aB" startOffset="50%" text-anchor="middle">CRYPTO · INVESTMENT · WIRE</textPath></text><path d="M100 62 L128 74 v26 c0 18-12 30-28 38-16-8-28-20-28-38V74z" fill="#123f7d" stroke="#c8a04a" stroke-width="2"/><path d="M100 62 L128 74 v26 c0 18-12 30-28 38z" fill="#0b2a5b"/><path d="M84 88h32M84 96h32M84 104h32" stroke="#c8a04a" stroke-width="1.5"/><circle cx="100" cy="73" r="3.4" fill="#c8a04a"/></svg>`;

const P = {};

P[''] = () => `
<div class="alert-bar"><div class="wrap"><strong>Alert</strong><span>Fake “recovery firms” are targeting people who already lost money. <a href="#/alerts">Read the advisory →</a></span></div></div>

P['report'] = () => `${head('Secure intake','File your case','Fill in what you can. Fields marked * are required. You will get a reference number by email — keep it.')}

P['types'] = () => `${head('Reference','Scam types','Each category lists the mechanism, the red flags and the evidence that matters.')}

  <h3>Red flags</h3><ul><li>Guaranteed, unusually steady returns</li><li>Pressure to recruit others</li><li>Withdrawals met with new fee demands</li></ul>
  <h3>Preserve</h3><p>Deposit confirmations, statements, the signed agreement, all message threads.</p>

const main = document.getElementById('main');
const nav = document.getElementById('nav');

function route() {
  const key = (location.hash.replace(/^#\/?/, '') || '').split('?')[0];
  main.innerHTML = (P[key] || P['404'])();
  nav.querySelectorAll('a').forEach(a => {
    if (a.hasAttribute('aria-current')) a.removeAttribute('aria-current');
    if (a.dataset.r === key) a.setAttribute('aria-current', 'page');
  });
  nav.classList.remove('open');
  window.scrollTo(0, 0);
}

document.getElementById('navToggle').addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  document.getElementById('navToggle').setAttribute('aria-expanded', open);
  document.getElementById('navToggle').textContent = open ? '✕' : '☰';
});

document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  location.hash = '#/faq';
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (!form.matches('form[data-form]')) return;
  e.preventDefault();
  const btn = form.querySelector('button[type="submit"]');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const ref = 'FR-' + new Date().getFullYear() + '-' + Math.floor(100000 + Math.random() * 899999);
  const data = new FormData(form);
  data.append('access_key', ACCESS_KEY);
  data.append('subject', 'New case ' + ref + ' — ' + (data.get('fraud_type') || 'contact'));
  data.append('from_name', BRAND + ' website');
  data.append('reference', ref);

  let ok = false;
  try {
    const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: data });
    ok = (await res.json()).success === true;
  } catch { ok = false; }

  const n = document.createElement('p');
  n.className = 'form-note';
  n.style.fontWeight = '700';
  if (ok) {
    n.style.color = '#0a6b3d';
    n.textContent = 'Received. Your reference is ' + ref + '. Check your inbox and reply to that email with documents.';
    form.appendChild(n);
    btn.textContent = 'Submitted ✓';
  } else {
    n.style.color = '#a11b1b';
    n.textContent = 'Could not send. Please email us directly at ' + EMAIL + '.';
    form.appendChild(n);
    btn.textContent = orig;
    btn.disabled = false;
  }
});

window.addEventListener('hashchange', route);
route();
</script>
